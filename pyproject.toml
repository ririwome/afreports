[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]

name = "pins_html_template"
version = "0.1.0"
authors = [
    {name = "Rishika Vashishtha", email = "rishika.vashishtha.dd@planninginspectorate.gov.uk"},
]
description = "Create HTML reports directly from Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E"]
dependencies = [
    "Jinja2>=3.1",
    "pandas>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pins_html_template"]
